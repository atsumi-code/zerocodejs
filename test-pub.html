<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroCode.js デモ - 公開ページ出力（renderToHtml）</title>

    <!-- 共通CSS（リセットCSS含む） -->
    <link rel="stylesheet" href="./css/common.css" />
    <!-- ページ専用CSS -->
    <link rel="stylesheet" href="./css/page.css" />
    <!-- サンプルデータ用CSS -->
    <link rel="stylesheet" href="./css/sample.css" />
  </head>
  <body>
    <div class="l-header l-header--pub">
      <div class="l-header-utility">
        <a class="demo-back-link" href="./index.html#demo" aria-label="デモ一覧へ戻る">
          <span aria-hidden="true">←</span>
          <span class="demo-util-label">デモ一覧へ戻る</span>
        </a>
        <div class="demo-help">
          <button
            type="button"
            class="demo-help-btn"
            aria-expanded="false"
            aria-controls="demo-help-popover-pub"
            aria-label="使い方"
          >
            <svg
              aria-hidden="true"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
              <path d="M12 17h.01" />
            </svg>
            <span class="demo-util-label">使い方</span>
          </button>
          <div
            id="demo-help-popover-pub"
            class="demo-help-popover"
            role="region"
            aria-label="このデモで試せること"
            hidden
          >
            <span class="demo-guide-title">このデモで試せること</span>
            <ol class="demo-guide-steps">
              <li>CMSデモ（zcode-cms / zcode-editor）で編集・保存する</li>
              <li>
                このページを再読み込みすると、保存した内容が編集UIなしの素のHTMLとして表示される
              </li>
              <li>
                編集用の <code>data-zcode-*</code> 属性が出力に含まれないことを開発者ツールで確認
              </li>
            </ol>
          </div>
        </div>
      </div>
      <h1>公開ページ出力（renderToHtml）</h1>
      <p>編集UIを含まない公開用HTML。CMSデモで保存した内容がそのまま反映されます</p>
    </div>

    <div class="l-container" role="main">
      <div id="cms-content"></div>
    </div>

    <div class="l-footer l-footer--pub">
      <h1>公開ページ出力（renderToHtml）</h1>
      <p>編集UIを含まない公開用HTML。CMSデモで保存した内容がそのまま反映されます</p>
    </div>

    <!-- jQuery -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <!-- 共通JavaScript -->
    <script src="./js/common.js"></script>
    <!-- アコーディオン機能 -->
    <script src="./js/accordion.js"></script>
    <!-- メインスクリプト -->
    <script type="module" src="/src/index.ts"></script>

    <script type="module">
      import { renderToHtml } from '/src/index.ts';

      function init() {
        ZeroCodeCommon.StorageManager.ensureSampleDataIfNeeded('test-cms');
        const rawData = ZeroCodeCommon.StorageManager.loadData('test-cms');

        const sampleData = {
          page: rawData.page,
          css: {
            common: rawData.cssCommon || '',
            individual: rawData.cssIndividual || '',
            special: rawData.cssSpecial || ''
          },
          parts: {
            common: rawData.typesCommon || [],
            individual: rawData.typesIndividual || [],
            special: rawData.typesSpecial || []
          },
          images: {
            common: rawData.imagesCommon || [],
            individual: rawData.imagesIndividual || [],
            special: rawData.imagesSpecial || []
          }
        };

        try {
          const html = renderToHtml(sampleData, {
            enableEditorAttributes: false
          });

          // CSSを<style>タグとして追加（共通 → 個別 → 専用の順）
          let styleTags = '';
          if (sampleData.css.common) {
            styleTags += `<style id="zcode-css-style-common" data-zcode-css-category="common">${sampleData.css.common}</style>`;
          }
          if (sampleData.css.individual) {
            styleTags += `<style id="zcode-css-style-individual" data-zcode-css-category="individual">${sampleData.css.individual}</style>`;
          }
          if (sampleData.css.special) {
            styleTags += `<style id="zcode-css-style-special" data-zcode-css-category="special">${sampleData.css.special}</style>`;
          }

          document.getElementById('cms-content').innerHTML = styleTags + html;

          const event = new CustomEvent('cms-content-updated');
          window.dispatchEvent(event);
          if (typeof jQuery !== 'undefined') {
            jQuery(document).trigger('cms-content-updated');
          }
        } catch (error) {
          console.error('Rendering error:', error);
          document.getElementById('cms-content').innerHTML =
            `<div style="color: red; padding: 20px;">エラー: ${error.message}</div>`;
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
