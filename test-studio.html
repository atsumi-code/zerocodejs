<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroCodeStudio - Test</title>

    <!-- 共通CSS（リセットCSS含む） -->
    <link rel="stylesheet" href="./css/common.css" />
    <!-- ページ専用CSS -->
    <link rel="stylesheet" href="./css/page.css" />
    <!-- サンプルデータ用CSS -->
    <link rel="stylesheet" href="./css/sample.css" />
  </head>
  <body>
    <div class="l-header l-header--dev">
      <h1>ZeroCodeStudio - 制作会社向け管理画面テスト</h1>
      <p>特別パーツ・特別CSS・特別画像のみ編集可（それ以外は読み取り専用）</p>
    </div>

    <div class="l-container">
      <zcode-studio id="test-cms" locale="ja">
        <!-- 共通CSS（リセットCSS含む） -->
        <link slot="css" rel="stylesheet" href="./css/common.css" />
        <!-- ページ専用CSS -->
        <link slot="css" rel="stylesheet" href="./css/page.css" />
        <!-- サンプルデータ用CSS -->
        <link slot="css" rel="stylesheet" href="./css/sample.css" />
        <!-- Scriptスロット（jQueryとアコーディオン） -->
        <script
          slot="script"
          src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"
        ></script>
        <script slot="script" src="./js/accordion.js"></script>
      </zcode-studio>
    </div>

    <div class="l-footer l-footer--dev">
      <h1>ZeroCodeStudio - 制作会社向け管理画面テスト</h1>
      <p>特別パーツ・特別CSS・特別画像のみ編集可</p>
    </div>

    <!-- リセットボタン -->
    <div id="reset-controls-fixed" class="reset-controls-fixed">
      <button id="reset-data-btn" class="reset-btn">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M3 21v-5h5" />
        </svg>
        <span>リセット</span>
      </button>
    </div>

    <!-- 共通JavaScript -->
    <script src="./js/common.js"></script>
    <!-- メインスクリプト -->
    <script type="module" src="/src/index.ts"></script>

    <script>
      let studio = null;

      async function init() {
        await waitForStudio();
        setTimeout(() => {
          studio = document.getElementById('test-cms');
          if (studio) {
            ZeroCodeCommon.StorageManager.ensureSampleDataIfNeeded('test-cms');
            ZeroCodeCommon.StorageManager.applyToComponent('test-cms');

            const resetBtn = document.getElementById('reset-data-btn');
            if (resetBtn) {
              resetBtn.addEventListener('click', () => {
                if (confirm('すべてのデータをリセットしますか？この操作は取り消せません。')) {
                  ZeroCodeCommon.StorageManager.clear('test-cms');
                  ZeroCodeCommon.StorageManager.saveSampleData('test-cms');
                  window.location.reload();
                }
              });
            }
          }
        }, 100);
      }

      function waitForStudio() {
        return new Promise((resolve) => {
          if (customElements.get('zcode-studio')) {
            resolve();
          } else {
            customElements.whenDefined('zcode-studio').then(resolve);
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
